<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chdb.eu.org — Arthur Godart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080b11;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-grid {
            background-size: 32px 32px;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        .fancy-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .fancy-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 
                -12px 20px 40px -10px rgba(0, 0, 0, 0.8),
                0 0 30px 2px rgba(99, 102, 241, 0.2);
        }

        .shine-layer {
            position: absolute;
            inset: 0;
            border-radius: 1.5rem;
            pointer-events: none;
            background: radial-gradient(
                800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.12),
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fancy-card:hover .shine-layer {
            opacity: 1;
        }

        .github-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
        }

        .github-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between bg-grid relative overflow-x-hidden min-h-screen selection:bg-indigo-500 selection:text-white">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[700px] h-[380px] bg-indigo-600/15 blur-[140px] rounded-full pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[500px] h-[350px] bg-violet-600/10 blur-[130px] rounded-full pointer-events-none"></div>

    <header class="w-full max-w-5xl mx-auto px-6 py-8 flex justify-between items-center z-10">
        <div class="flex items-center gap-2.5">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <span class="font-mono text-xs tracking-widest text-emerald-400 font-semibold uppercase">Domaine Vérifié</span>
        </div>
        
        <a href="https://github.com/Artleboss2" target="_blank" rel="noopener noreferrer" class="github-btn inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-medium text-slate-200">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>@Artleboss2</span>
        </a>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-6 py-10 z-10 max-w-4xl mx-auto text-center">
        
        <h1 class="font-serif italic text-5xl sm:text-7xl md:text-8xl font-extrabold tracking-tight mb-4 bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400">
            chdb.eu.org
        </h1>

        <p class="text-base sm:text-lg text-slate-400 max-w-xl font-light mb-12 leading-relaxed">
            Ce domaine est réservé et sous la gestion exclusive de son propriétaire.
        </p>

        <div id="tiltCard" class="fancy-card w-full max-w-md rounded-3xl p-7 text-left relative overflow-hidden cursor-pointer">
            <div class="shine-layer"></div>

            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
                        AG
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-wide">Arthur Godart</h2>
                        <a href="https://github.com/Artleboss2" target="_blank" rel="noopener noreferrer" class="text-xs text-indigo-400 font-mono hover:underline inline-flex items-center gap-1 mt-0.5">
                            @Artleboss2
                            <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </a>
                    </div>
                </div>
                
                <div class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
            </div>

            <div class="space-y-3.5 pt-4 border-t border-slate-800/80 text-sm">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-light">Titulaire</span>
                    <span class="text-slate-200 font-medium">Arthur Godart</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-light">Adresse Web</span>
                    <span class="font-mono text-indigo-300 font-medium">chdb.eu.org</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-light">Statut</span>
                    <span class="inline-flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                        Propriété privée
                    </span>
                </div>
            </div>

            <button onclick="copyDomain()" id="copyBtn" class="mt-8 w-full py-3.5 px-4 rounded-xl bg-slate-800/90 hover:bg-indigo-600 text-slate-200 hover:text-white font-medium text-sm transition-all duration-300 border border-slate-700/60 hover:border-indigo-500 flex items-center justify-center gap-2 active:scale-[0.98]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                Copier l'adresse
            </button>
        </div>

    </main>

    <footer class="w-full max-w-5xl mx-auto px-6 py-8 text-center text-xs text-slate-400 z-10">
        <p>© <span id="year"></span> chdb.eu.org — Réservé par Arthur Godart.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const card = document.getElementById('tiltCard');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -12;
            const rotateY = ((x - centerX) / centerX) * 12;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
        });

        function copyDomain() {
            const domainText = 'chdb.eu.org';

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(domainText);
            } else {
                const textArea = document.createElement('textarea');
                textArea.value = domainText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }

            const btn = document.getElementById('copyBtn');
            const originalHTML = btn.innerHTML;

            btn.innerHTML = `
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Adresse copiée !
            `;
            btn.classList.add('bg-emerald-950/50', 'border-emerald-500/50', 'text-emerald-300');

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-emerald-950/50', 'border-emerald-500/50', 'text-emerald-300');
            }, 2000);
        }
    </script>
</body>
</html>
